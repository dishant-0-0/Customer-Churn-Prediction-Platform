[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-churn-ml"
version = "1.0.0"
description = "Production-ready Customer Churn Prediction Platform"
readme = "README.md"
requires-python = ">=3.13"

authors = [
    { name = "Dishant Patel" }
]

license = { text = "MIT" }

keywords = [
    "machine-learning",
    "customer-churn",
    "mlops",
    "fastapi",
    "xgboost",
    "mlflow",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

# ---------------------------------------------------
# Black
# ---------------------------------------------------

[tool.black]

line-length = 79
target-version = ["py313"]

# ---------------------------------------------------
# Ruff
# ---------------------------------------------------

[tool.ruff]

line-length = 79
target-version = "py313"

exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "artifacts",
    "mlruns",
    "notebooks",
]

[tool.ruff.lint]

select = [
    "E",
    "F",
    "W",
    "I",
]

# ---------------------------------------------------
# isort
# ---------------------------------------------------

[tool.isort]

profile = "black"
line_length = 79

# ---------------------------------------------------
# MyPy
# ---------------------------------------------------

[tool.mypy]

python_version = "3.13"

warn_return_any = true

warn_unused_configs = true

disallow_untyped_defs = false

ignore_missing_imports = true

exclude = [
    "tests",
]

# ---------------------------------------------------
# Pytest
# ---------------------------------------------------

[tool.pytest.ini_options]

testpaths = [
    "tests",
]

python_files = [
    "test_*.py",
]

addopts = """
-v
-ra
--strict-markers
"""

filterwarnings = [
    "ignore:The set_bad function will be deprecated.*:PendingDeprecationWarning",
    "ignore:The set_over function will be deprecated.*:PendingDeprecationWarning",
    "ignore:The set_under function will be deprecated.*:PendingDeprecationWarning",
]

# ---------------------------------------------------
# setuptools
# ---------------------------------------------------

[tool.setuptools]

include-package-data = true

[tool.setuptools.packages.find]

include = ["src*"]
