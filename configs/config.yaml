project:
  name: customer-churn
  version: 1.0.0

files:
  raw_file: customer_churn.csv
  interim_file: customer_churn_cleaned.csv
  processed_file: customer_churn_features.csv
  config_file: config.yaml

data:
  target: Churn Value
  test_size: 0.2
  validation_size: 0.1
  random_state: 42

feature_engineering:
  required_columns:
  - Tenure Months
  - Monthly Charges
  - Total Charges
  - CLTV

  drop_columns:
  - CustomerID
  - Count
  - Churn Label
  - Churn Score
  - Churn Reason

  drop_location_columns:
  - Zip Code
  - Lat Long
  - Latitude
  - Longitude
  - Country
  - State
  - City

  tenure_bins:
  - 0
  - 12
  - 36
  - 72

  tenure_labels:
  - New
  - Medium
  - Loyal

  high_value_strategy: median

training:
  model:
    name: xgboost
    params:
      random_state: 42
      n_estimators: 300
      learning_rate: 0.05
      max_depth: 5
      subsample: 0.8
      colsample_bytree: 0.8
      eval_metric: logloss

evaluation:
  threshold: 0.2

logging:
  level: INFO
  file: logs/app.log
  console: true

artifacts:
  version: v1

tracking:
  enabled: true
  experiment_name: customer_churn
  tracking_uri: sqlite:///mlflow.db

visualization:
  style: seaborn-v0_8
  dpi: 150

  figsize:
    width: 6
    height: 5

  font:
    title_size: 14
    label_size: 12
    tick_size: 10

  confusion_matrix:
    cmap: Blues
    annot: true

  roc_curve:
    color: "#1f77b4"
    linewidth: 2

  feature_importance:
    top_n: 20
    color: "#1f77b4"

  shap:
    max_display: 20


api:
  title: "Customer Churn Prediction API"
  description: "REST API for customer churn prediction."
  version: "1.0.0"

  cors:
    allow_origins:
      - "*"
    allow_credentials: true
    allow_methods:
      - "*"
    allow_headers:
      - "*"
