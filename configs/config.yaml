project:
  name: customer-churn
  version: 1.0.0

paths:
  config_file: config.yaml
  raw_file: customer_churn.csv
  interim_file: customer_churn_cleaned.csv
  processed_file: customer_churn_features.csv

data:
  target: Churn Value
  test_size: 0.2
  validation_size: 0.1
  random_state: 42

feature_engineering:
  high_value_threshold: 100

training:
  model: xgboost

logging:
  level: INFO


