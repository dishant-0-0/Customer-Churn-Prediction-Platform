services:

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: churn-api

    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      PYTHONUNBUFFERED: "1"

    volumes:
      - ./artifacts:/app/artifacts
      - ./mlflow.db:/app/mlflow.db

    depends_on:
      - mlflow

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.14.0

    container_name: churn-mlflow

    restart: unless-stopped

    command:
      - mlflow
      - ui
      - --backend-store-uri
      - sqlite:////app/mlflow.db
      - --host
      - 0.0.0.0
      - --port
      - "5000"

    ports:
      - "5000:5000"

    volumes:
      - ./mlflow.db:/app/mlflow.db
